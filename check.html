<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIMON Labs — 3D পরীক্ষা</title>
<style>
  body{background:#04120c;color:#e9f6ef;font-family:sans-serif;margin:0;padding:22px 18px;line-height:1.6}
  h1{font-size:1.25rem;margin-bottom:4px}
  p.sub{color:#a7c4b5;margin-top:0}
  .row{background:rgba(255,255,255,.06);border:1px solid rgba(52,211,153,.25);border-radius:12px;padding:12px 14px;margin-top:12px;word-break:break-word}
  .k{color:#34d399;font-weight:700}
  .ok{color:#6ee7b7}.bad{color:#fca5a5}
  .log{color:#fcd34d;font-size:.78rem;white-space:pre-wrap}
</style>
</head>
<body>
<h1>LIMON Labs — 3D পরীক্ষা</h1>
<p class="sub">এই পেজটা তোমার ফোন নিজেই সাইটের আসল 3D কোড চালিয়ে পরীক্ষা করে। নিচের ফলাফলের একটা screenshot পাঠালেই হবে।</p>
<div id="out"></div>

<script>
(function () {
  var out = document.getElementById("out");
  function row(k, v, cls, log) {
    var d = document.createElement("div");
    d.className = "row";
    d.innerHTML = '<span class="k">' + k + ': </span><span class="' + (cls || "") + '">' + v + "</span>" +
      (log ? '<div class="log">' + log.replace(/</g, "&lt;") + "</div>" : "");
    out.appendChild(d);
  }
  row("ব্রাউজার", navigator.userAgent);
  row("পর্দা", window.innerWidth + " × " + window.innerHeight + " · DPR " + (window.devicePixelRatio || 1));

  var gl = null;
  try {
    gl = document.createElement("canvas").getContext("webgl", { alpha: true, antialias: true, powerPreference: "low-power" });
  } catch (e) { /* fallthrough */ }
  if (!gl) { row("WebGL (3D ইঞ্জিন)", "পাওয়া যায়নি ✗", "bad"); return; }
  row("WebGL (3D ইঞ্জিন)", "আছে ✓", "ok");
  var dbg = gl.getExtension("WEBGL_debug_renderer_info");
  if (dbg) row("গ্রাফিক্স", gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));

  function testProg(name, vsSrc, fsSrc) {
    function sh(type, src) {
      var s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) return { err: gl.getShaderInfoLog(s) };
      return { s: s };
    }
    var v = sh(gl.VERTEX_SHADER, vsSrc);
    if (v.err) { row(name, "vertex কম্পাইল হয়নি ✗", "bad", v.err); return false; }
    var f = sh(gl.FRAGMENT_SHADER, fsSrc);
    if (f.err) { row(name, "fragment কম্পাইল হয়নি ✗", "bad", f.err); return false; }
    var pr = gl.createProgram();
    gl.attachShader(pr, v.s); gl.attachShader(pr, f.s); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) {
      row(name, "লিংক হয়নি ✗", "bad", gl.getProgramInfoLog(pr));
      return false;
    }
    row(name, "চলছে ✓", "ok");
    return true;
  }

  /* --- Program B: glass orb (exact site source) --- */
  var orbOK = testProg("গোলকের শেডার",
    "attribute vec3 p; attribute vec3 n;" +
    "uniform mat4 uMVP; uniform mat4 uModel;" +
    "varying vec3 vN; varying vec3 vWP; varying vec3 vObj;" +
    "void main(){ vObj = p; vN = mat3(uModel) * n; vec4 wp = uModel * vec4(p, 1.0); vWP = wp.xyz;" +
    " gl_Position = uMVP * vec4(p, 1.0); }",
    "precision mediump float;" +
    "varying vec3 vN; varying vec3 vWP; varying vec3 vObj;" +
    "uniform float uTime; uniform vec3 uCam;" +
    "void main(){" +
    "  vec3 N = normalize(vN); vec3 V = normalize(uCam - vWP);" +
    "  float fres = pow(1.0 - abs(dot(N, V)), 2.0);" +
    "  float swirl = sin(vObj.y * 7.0 + uTime * 0.6 + sin(vObj.x * 5.0 - uTime * 0.45) * 1.6) * 0.5 + 0.5;" +
    "  float swirl2 = sin(vObj.z * 9.0 - uTime * 0.35 + vObj.y * 4.0) * 0.5 + 0.5;" +
    "  vec3 deep = vec3(0.012, 0.16, 0.10);" +
    "  vec3 mid = vec3(0.03, 0.48, 0.30);" +
    "  vec3 col = mix(deep, mid, swirl * 0.45 + swirl2 * 0.25);" +
    "  col += vec3(0.10, 0.85, 0.55) * pow(swirl * swirl2, 2.0) * 0.55;" +
    "  vec3 L = normalize(vec3(0.5, 0.75, 0.85));" +
    "  float spec = pow(max(dot(reflect(-L, N), V), 0.0), 70.0) * 1.4;" +
    "  vec3 L2 = normalize(vec3(-0.7, -0.35, 0.6));" +
    "  float spec2 = pow(max(dot(reflect(-L2, N), V), 0.0), 26.0) * 0.35;" +
    "  col += vec3(0.85, 1.0, 0.95) * spec + vec3(0.35, 0.75, 0.9) * spec2;" +
    "  col = mix(col, vec3(0.45, 1.0, 0.78), fres * 0.95);" +
    "  float alpha = mix(0.62, 1.0, fres);" +
    "  gl_FragColor = vec4(col, alpha);" +
    "}");

  /* --- Program C: rings / sparkles / core (exact site source, fixed) --- */
  var fxOK = testProg("বলয়-ঝিলিকের শেডার",
    "attribute vec3 p; attribute float aSeed;" +
    "uniform mat4 uMVP; uniform highp float uPoint;" +
    "varying float vSeed;" +
    "void main(){ vSeed = aSeed;" +
    "  vec4 mv = uMVP * vec4(p, 1.0);" +
    "  if (uPoint > 0.5) { gl_PointSize = (2.2 + aSeed * 3.4) * (120.0 / -mv.z); }" +
    "  gl_Position = mv; }",
    "precision mediump float;" +
    "uniform vec4 uColor; uniform highp float uPoint; uniform float uTime;" +
    "varying float vSeed;" +
    "void main(){" +
    "  float a = uColor.a;" +
    "  if (uPoint > 0.5) {" +
    "    vec2 d = gl_PointCoord - 0.5;" +
    "    float m = smoothstep(0.5, 0.05, length(d));" +
    "    float tw = 0.65 + 0.35 * sin(uTime * (1.2 + vSeed * 2.0) + vSeed * 40.0);" +
    "    a *= m * tw;" +
    "  }" +
    "  gl_FragColor = vec4(uColor.rgb, a);" +
    "}");

  /* --- Program D: halo glow (exact site source) --- */
  var glowOK = testProg("আভার শেডার",
    "attribute vec2 p; uniform mat4 uMVP; varying vec2 vUv;" +
    "void main(){ vUv = p * 0.5 + 0.5; gl_Position = uMVP * vec4(p, 0.0, 1.0); }",
    "precision mediump float; varying vec2 vUv;" +
    "uniform sampler2D uTex; uniform vec3 uTint; uniform float uAlpha;" +
    "void main(){ float a = texture2D(uTex, vUv).a; gl_FragColor = vec4(uTint, a * uAlpha); }");

  row("সব মিলিয়ে", (orbOK && fxOK && glowOK) ? "তোমার ফোনে 3D চলবে ✓ এবার সাইটটা খুলে দেখো" : "কোথাও আটকাচ্ছে — ওপরের লেখাটা দেখাও", (orbOK && fxOK && glowOK) ? "ok" : "bad");

  fetch("script.js", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
    var fresh = t.indexOf("uniform mat4 uMVP; uniform highp float uPoint;") !== -1;
    row("সার্ভারের কোড", fresh ? "সর্বশেষ (ঠিক করা) সংস্করণ ✓" : "পুরনো কোড!", fresh ? "ok" : "bad");
  }).catch(function () { row("সার্ভারের কোড", "যাচাই করা যায়নি"); });
})();
</script>
</body>
</html>
