<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIMON Labs — 3D পরীক্ষা</title>
<style>
  body{background:#04120c;color:#e9f6ef;font-family:sans-serif;margin:0;padding:22px 18px;line-height:1.6}
  h1{font-size:1.25rem;margin-bottom:4px}
  p.sub{color:#a7c4b5;margin-top:0}
  .row{background:rgba(255,255,255,.06);border:1px solid rgba(52,211,153,.25);border-radius:12px;padding:12px 14px;margin-top:12px;word-break:break-word}
  .k{color:#34d399;font-weight:700}
  .ok{color:#6ee7b7}.bad{color:#fca5a5}
  .log{color:#fcd34d;font-size:.78rem;white-space:pre-wrap}
  canvas.sample{display:block;width:180px;height:320px;margin-top:12px;border-radius:12px;border:1px solid rgba(52,211,153,.35)}
</style>
</head>
<body>
<h1>LIMON Labs — 3D পরীক্ষা</h1>
<p class="sub">এই পেজটা তোমার ফোনে সাইটের আসল ব্যাকগ্রাউন্ড-3D কোড চালিয়ে পরীক্ষা করে। নিচের ফলাফলের একটা screenshot পাঠালেই হবে।</p>
<div id="out"></div>

<script>
(function () {
  var out = document.getElementById("out");
  function row(k, v, cls, log) {
    var d = document.createElement("div");
    d.className = "row";
    d.innerHTML = '<span class="k">' + k + ': </span><span class="' + (cls || "") + '">' + v + "</span>" +
      (log ? '<div class="log">' + log.replace(/</g, "&lt;") + "</div>" : "");
    out.appendChild(d);
  }
  row("ব্রাউজার", navigator.userAgent);
  row("পর্দা", window.innerWidth + " × " + window.innerHeight + " · DPR " + (window.devicePixelRatio || 1));

  var gl = null;
  try {
    gl = document.createElement("canvas").getContext("webgl", { alpha: false, antialias: false, powerPreference: "low-power" });
  } catch (e) { /* fallthrough */ }
  if (!gl) { row("WebGL (3D ইঞ্জিন)", "পাওয়া যায়নি ✗", "bad"); finish(false); return; }
  row("WebGL (3D ইঞ্জিন)", "আছে ✓", "ok");
  var dbg = gl.getExtension("WEBGL_debug_renderer_info");
  if (dbg) row("গ্রাফিক্স", gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));

  /* The site's CURRENT background shaders, copied exactly from script.js */
  var BG_VS = "attribute vec2 p; varying mediump vec2 vUv;" +
    "void main(){ vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }";
  var BG_FS = "precision mediump float;" +
    "varying mediump vec2 vUv;" +
    "uniform sampler2D uTex; uniform vec2 uRes; uniform vec2 uImg;" +
    "uniform float uTime; uniform vec2 uShift;" +
    "void main(){" +
    "  float scale = max(uRes.x / uImg.x, uRes.y / uImg.y) * 1.02;" +
    "  vec2 scaled = uImg * scale;" +
    "  vec2 offPx = vec2((uRes.x - scaled.x) * 0.5, uRes.y - scaled.y);" +
    "  vec2 uvImg = (vUv * uRes - offPx) / scaled;" +
    "  vec3 probe = texture2D(uTex, uvImg).rgb;" +
    "  float lum = dot(probe, vec3(0.299, 0.587, 0.114));" +
    "  float depth = clamp(0.7 * lum + 0.3 * (1.0 - vUv.y), 0.0, 1.0);" +
    "  float fuel = smoothstep(0.15, 0.6, lum);" +
    "  float wave = sin(uvImg.x * 4.0 + uTime * 2.5 + sin(uvImg.y * 3.0 - uTime * 1.8) * 1.5);" +
    "  float ripple = sin(uvImg.x * 9.0 - uTime * 5.0 + uvImg.y * 4.0);" +
    "  float tongue = sin(uvImg.x * 12.0 - uTime * 4.0 + uvImg.y * 6.0 + sin(uvImg.x * 5.0 + uvImg.y * 3.0) * 1.2);" +
    "  vec2 sway = vec2(sin(uTime * 0.8), cos(uTime * 0.6)) * 0.15;" +
    "  vec2 mv = (uShift + sway) * (depth - 0.45) * 0.034;" +
    "  mv.x += wave * 0.002 * fuel;" +
    "  mv.y -= (0.5 + 0.5 * tongue) * 0.0028 * fuel;" +
    "  float smoke = 1.0 - smoothstep(0.10, 0.45, lum);" +
    "  mv.x += sin(uvImg.y * 3.0 + uTime * 0.7 + sin(uvImg.x * 2.0 - uTime * 0.5) * 1.3) * 0.011 * smoke;" +
    "  mv.x += sin(uvImg.x * 6.0 - uTime * 0.9 + uvImg.y * 3.0) * 0.003 * smoke;" +
    "  mv.y += cos(uvImg.x * 2.5 - uTime * 0.55) * 0.006 * smoke;" +
    "  mv.x += sin(vUv.y * 140.0 + uTime * 13.0) * 0.0009 * (1.0 - smoothstep(0.05, 0.3, vUv.y));" +
    "  vec3 col = texture2D(uTex, uvImg + mv).rgb;" +
    "  col *= 1.0 + tongue * 0.50 * fuel + wave * 0.12 * fuel + ripple * 0.07 * fuel;" +
    "  col += vec3(0.35, 1.0, 0.7) * pow(max(tongue, 0.0), 3.0) * 0.45 * fuel;" +
    "  col += vec3(0.30, 0.95, 0.65) * pow(lum, 3.0) * 0.70 * (0.75 + 0.25 * tongue);" +
    "  col *= 1.0 + 0.08 * sin(uvImg.x * 2.0 - uTime * 0.8 + uvImg.y * 2.5) * smoke;" +
    "  col *= mix(1.0, 0.91 + 0.09 * sin(uTime * 7.0 + sin(uTime * 13.0) * 1.5), fuel);" +
    "  float g = 1.0 - vUv.y;" +
    "  float ga = g < 0.46 ? mix(0.14, 0.50, g / 0.46) : mix(0.50, 0.80, (g - 0.46) / 0.54);" +
    "  col = mix(col, vec3(0.008, 0.04, 0.024), ga);" +
    "  gl_FragColor = vec4(col, 1.0);" +
    "}";

  function sh(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) return { err: gl.getShaderInfoLog(s) };
    return { s: s };
  }
  var v = sh(gl.VERTEX_SHADER, BG_VS);
  if (v.err) { row("ব্যাকগ্রাউন্ড শেডার", "vertex কম্পাইল হয়নি ✗", "bad", v.err); finish(false); return; }
  var f = sh(gl.FRAGMENT_SHADER, BG_FS);
  if (f.err) { row("ব্যাকগ্রাউন্ড শেডার", "fragment কম্পাইল হয়নি ✗", "bad", f.err); finish(false); return; }
  var pr = gl.createProgram();
  gl.attachShader(pr, v.s); gl.attachShader(pr, f.s); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) {
    row("ব্যাকগ্রাউন্ড শেডার", "লিংক হয়নি ✗", "bad", gl.getProgramInfoLog(pr));
    finish(false); return;
  }
  row("ব্যাকগ্রাউন্ড শেডার", "চলছে ✓", "ok");

  /* Full-path test: real bg.webp texture + one real frame, drawn live below */
  var cv = document.createElement("canvas");
  cv.width = 180; cv.height = 320; cv.className = "sample";
  var gl2 = cv.getContext("webgl", { alpha: false, antialias: false, preserveDrawingBuffer: true });
  var img = new Image();
  img.onload = function () {
    try {
      var pr2 = gl2.createProgram();
      function sh2(t, src) { var s = gl2.createShader(t); gl2.shaderSource(s, src); gl2.compileShader(s); return s; }
      gl2.attachShader(pr2, sh2(gl2.VERTEX_SHADER, BG_VS));
      gl2.attachShader(pr2, sh2(gl2.FRAGMENT_SHADER, BG_FS));
      gl2.linkProgram(pr2); gl2.useProgram(pr2);
      var buf = gl2.createBuffer();
      gl2.bindBuffer(gl2.ARRAY_BUFFER, buf);
      gl2.bufferData(gl2.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl2.STATIC_DRAW);
      var loc = gl2.getAttribLocation(pr2, "p");
      gl2.enableVertexAttribArray(loc);
      gl2.vertexAttribPointer(loc, 2, gl2.FLOAT, false, 0, 0);
      var tex = gl2.createTexture();
      gl2.bindTexture(gl2.TEXTURE_2D, tex);
      gl2.pixelStorei(gl2.UNPACK_FLIP_Y_WEBGL, true);
      gl2.texImage2D(gl2.TEXTURE_2D, 0, gl2.RGBA, gl2.RGBA, gl2.UNSIGNED_BYTE, img);
      gl2.texParameteri(gl2.TEXTURE_2D, gl2.TEXTURE_WRAP_S, gl2.CLAMP_TO_EDGE);
      gl2.texParameteri(gl2.TEXTURE_2D, gl2.TEXTURE_WRAP_T, gl2.CLAMP_TO_EDGE);
      gl2.texParameteri(gl2.TEXTURE_2D, gl2.TEXTURE_MIN_FILTER, gl2.LINEAR);
      gl2.texParameteri(gl2.TEXTURE_2D, gl2.TEXTURE_MAG_FILTER, gl2.LINEAR);
      gl2.uniform1i(gl2.getUniformLocation(pr2, "uTex"), 0);
      gl2.uniform2f(gl2.getUniformLocation(pr2, "uRes"), cv.width, cv.height);
      gl2.uniform2f(gl2.getUniformLocation(pr2, "uImg"), img.naturalWidth, img.naturalHeight);
      gl2.uniform1f(gl2.getUniformLocation(pr2, "uTime"), 2.0);
      gl2.uniform2f(gl2.getUniformLocation(pr2, "uShift"), 0, 0);
      gl2.viewport(0, 0, cv.width, cv.height);
      gl2.drawArrays(gl2.TRIANGLE_STRIP, 0, 4);
      var px = new Uint8Array(4);
      gl2.readPixels(90, 160, 1, 1, gl2.RGBA, gl2.UNSIGNED_BYTE, px);
      var good = px[1] > 12;
      row("আসল ছবি + ফ্রেম", good ? "আঁকা হয়েছে ✓ (মাঝের রং: " + px[0] + "," + px[1] + "," + px[2] + ")" : "ছবি আঁকা যায়নি ✗ (রং: " + px[0] + "," + px[1] + "," + px[2] + ")", good ? "ok" : "bad");
      var label = document.createElement("div");
      label.className = "row";
      label.innerHTML = '<span class="k">নমুনা:</span> তোমার ফোনে আঁকা 3D ব্যাকগ্রাউন্ড ↓';
      out.appendChild(label);
      out.appendChild(cv);
      finish(good);
    } catch (e) {
      row("আসল ছবি + ফ্রেম", "ব্যতিক্রম ✗", "bad", String(e));
      finish(false);
    }
  };
  img.onerror = function () { row("আসল ছবি (bg.webp)", "লোড হয়নি ✗", "bad"); finish(false); };
  img.src = "bg.webp";

  function finish(shaderOK) {
    fetch("script.js", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
      var fresh = t.indexOf("Live 3D depth background") !== -1;
      row("সার্ভারের কোড", fresh ? "সর্বশেষ (3D ব্যাকগ্রাউন্ড) সংস্করণ ✓" : "পুরনো কোড!", fresh ? "ok" : "bad");
      row("সব মিলিয়ে", (shaderOK && fresh) ? "তোমার ফোনে 3D ব্যাকগ্রাউন্ড চলবে ✓ এবার সাইটটা খুলে দেখো" : "কোথাও আটকাচ্ছে — এই পেজের screenshot টা পাঠাও", (shaderOK && fresh) ? "ok" : "bad");
    }).catch(function () { row("সার্ভারের কোড", "যাচাই করা যায়নি"); });
  }
})();
</script>
</body>
</html>
